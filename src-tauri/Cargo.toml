[package]
name = "payment-schedule"
version = "0.1.0"
description = "paymentSchedule — installment-sale tracking for small Tunisian appliance shops"
authors = ["paymentSchedule"]
edition = "2021"
rust-version = "1.77"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
name = "payment_schedule_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-os = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
tauri-plugin-opener = "2.5.4"
# Two SQLite connections to one file is the classic corruption window. The DB
# lives in the app-data dir, so nothing stops a user double-launching the
# AppImage or the desktop entry — this makes a second launch focus the first.
tauri-plugin-single-instance = "2"
# Backend diagnostics. Command failures used to vanish entirely: every error was
# stringified to the renderer and recorded nowhere, so a user's report could not
# be traced. See `AppError::internal`.
log = "0.4"
tauri-plugin-log = "2"

[features]
# This feature is used for production builds or when a dev server is not specified,
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

# Smaller, faster release binaries.
[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
