[package]
name = "payment-schedule"
# Single source of truth for the shipped app version: `tauri.conf.json` omits
# its `version` key, so Tauri falls back to this one for the installer names,
# the MSI product version and `app.getVersion()`. See README "Releases via CI".
version = "1.0.0"
description = "paymentSchedule — installment-sale tracking for small Tunisian appliance shops"
authors = ["paymentSchedule"]
edition = "2021"
# Measured against the locked dependency set, not guessed: `darling`, `plist`,
# `time` and `serde_with` all declare 1.88. The previous value (1.77) advertised
# a floor that could never have built.
rust-version = "1.88"
repository = "https://github.com/MalekGn/payment-schedule-desktop"
# Proprietary — see the LICENSE file at the repository root. `publish = false`
# keeps this off crates.io and lets `cargo deny` skip the SPDX check for our own
# crate (see `[licenses.private]` in deny.toml).
license-file = "../LICENSE"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
name = "payment_schedule_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-os = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Held at 0.39, not 0.40: `rusqlite 0.40` requires `libsqlite3-sys 0.38`, whose
# build script uses `cfg_select!` — stabilized only in Rust 1.95, which would
# drag the MSRV below up seven minors. It declares no `rust-version`, so nothing
# warns; the `msrv` CI job is what catches it. All 0.40 adds over 0.39 is virtual
# -table API changes, and this crate has no virtual tables, so the ceiling costs
# nothing. Revisit when 1.95 is an acceptable floor.
rusqlite = { version = "0.39", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
tauri-plugin-opener = "2.5.4"
# Two SQLite connections to one file is the classic corruption window. The DB
# lives in the app-data dir, so nothing stops a user double-launching the
# AppImage or the desktop entry — this makes a second launch focus the first.
tauri-plugin-single-instance = "2"
# Backend diagnostics. Command failures used to vanish entirely: every error was
# stringified to the renderer and recorded nowhere, so a user's report could not
# be traced. See `AppError::internal`.
log = "0.4"
tauri-plugin-log = "2"

# --- offline licence validation (src/license.rs) ---------------------------
# The first cryptography in this tree. Pure Rust on purpose: `ring` and
# `sodiumoxide` both need a C/asm toolchain, which the Windows MSI build (still
# 🟡 in features.md) does not have, and `ring`'s mixed ISC-and-others expression
# would trip the `deny.toml` allow-list. `ed25519-dalek`, `curve25519-dalek` and
# `subtle` are BSD-3-Clause, already allowed there.
ed25519-dalek = "3"
base64 = "0.23"
# 0.11 is not a free choice: `ed25519-dalek 3` requires `sha2 ^0.11`, so the two
# move together. That reintroduces a duplicate — `tauri-codegen` still pulls
# 0.10 — but only on the proc-macro chain, which runs at build time and never
# reaches the shipped binary. `[bans] multiple-versions = "warn"` in deny.toml
# covers it. (The previous note here blamed `wry` for the 0.10 copy; it was
# `tauri-codegen` all along.) The same applies to base64: `plist` holds 0.22.
sha2 = "0.11"
# Reads the per-OS machine identifier (/etc/machine-id, MachineGuid,
# IOPlatformUUID). MIT. Its only dependencies are platform-gated — nothing at
# all on Linux, where it is a plain file read.
machine-uid = "0.6"

[features]
# This feature is used for production builds or when a dev server is not specified,
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

# Smaller, faster release binaries.
[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
