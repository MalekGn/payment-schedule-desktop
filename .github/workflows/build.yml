name: Release desktop bundles

# Build the Tauri desktop app for Linux (deb + rpm/RedHat) and Windows (msi + nsis)
# and publish them to a GitHub Release whenever a version tag is pushed, e.g.:
#   git tag v0.1.0 && git push origin v0.1.0
# `workflow_dispatch` lets you also trigger a build manually from the Actions tab.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# A newer tag build supersedes an in-flight one for the same ref.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

# tauri-action needs write access to create the Release and upload installers.
permissions:
  contents: write

# Third-party actions are pinned to a full commit SHA (with the human-readable
# version in a trailing comment) so a moved tag can't silently swap the code we run.
# Dependabot (see .github/dependabot.yml) keeps these pins current.
jobs:
  # Fast gate: lint + typecheck + unit tests must pass before we spend time on native bundling.
  test:
    name: Lint, typecheck & unit tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier format check
        run: npm run format:check

      - name: Typecheck & build frontend
        run: npm run build

      - name: Unit tests
        run: npm test

  # Rust lint gate: format + clippy on the Tauri backend.
  rust-lint:
    name: Rust format & clippy
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev

      - name: Set up Rust (with rustfmt + clippy)
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab # v2.7.5
        with:
          workspaces: src-tauri -> target

      - name: rustfmt (check)
        run: cargo fmt --check
        working-directory: src-tauri

      - name: clippy (warnings as errors)
        run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri

  # Proves the MSRV declared in Cargo.toml is real. Without this the claim is
  # never exercised — it had drifted to 1.77 against a dependency set that
  # actually needed 1.88, so the manifest advertised a floor that could not
  # build. `rust-toolchain.toml` pins the channel for humans, so override it
  # explicitly here.
  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev

      - name: Set up Rust 1.88
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: "1.88"

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab # v2.7.5
        with:
          workspaces: src-tauri -> target
          key: msrv

      - name: cargo check on the declared MSRV
        run: cargo +1.88 check --locked --all-targets
        working-directory: src-tauri

  release:
    name: ${{ matrix.label }}
    needs: [test, rust-lint]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux: build on 22.04 for broad glibc compatibility with older distros.
          # deb -> Debian/Ubuntu, rpm -> RedHat/Fedora/openSUSE.
          # appimage -> a single self-contained file that runs without installing.
          - os: ubuntu-22.04
            label: Linux (deb + rpm + AppImage)
            bundles: deb,rpm,appimage
          # Windows: msi + nsis installers run on Windows 10 and 11.
          - os: windows-latest
            label: Windows (msi + nsis)
            bundles: msi,nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            file \
            libssl-dev \
            rpm

      - name: Set up Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab # v2.7.5
        with:
          workspaces: src-tauri -> target

      - name: Install JS dependencies
        run: npm ci

      # Builds the frontend (via beforeBuildCommand), then the native bundles, then
      # creates/updates the GitHub Release for this tag and uploads the installers to it.
      # Both matrix runners target the same tagName, so they attach to one shared Release.
      # --bundles overrides tauri.conf.json targets so each OS emits only its own installers.
      - name: Build & publish to GitHub Release
        uses: tauri-apps/tauri-action@42e9df6c59070d114bf90dcd3943a1b8f138b113 # v0.5.20
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "paymentSchedule ${{ github.ref_name }}"
          releaseBody: "Desktop installers for Linux (deb/rpm) and Windows (msi/nsis). See the assets below."
          # Published as a draft so you can review the assets and notes before it goes live.
          releaseDraft: true
          prerelease: false
          args: --bundles ${{ matrix.bundles }}
