name: Release desktop bundles

# Build the Tauri desktop app for Linux (deb + rpm/RedHat) and Windows (msi + nsis)
# and publish them to a GitHub Release whenever a version tag is pushed, e.g.:
#   git tag v0.1.0 && git push origin v0.1.0
# `workflow_dispatch` lets you also trigger a build manually from the Actions tab.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# A newer tag build supersedes an in-flight one for the same ref.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

# tauri-action needs write access to create the Release and upload installers.
permissions:
  contents: write

# Third-party actions are pinned to a full commit SHA (with the human-readable
# version in a trailing comment) so a moved tag can't silently swap the code we run.
# Dependabot (see .github/dependabot.yml) keeps these pins current.
jobs:
  # Every pre-flight check lives in ci.yml and is called from here rather than
  # copied, so the gate a release passes is byte-for-byte the gate every push
  # passes. Duplicating these jobs was the alternative, and duplicated CI drifts.
  gate:
    name: CI gate
    uses: ./.github/workflows/ci.yml

  release:
    name: ${{ matrix.label }}
    needs: [gate]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux: build on 22.04 for broad glibc compatibility with older distros.
          # deb -> Debian/Ubuntu, rpm -> RedHat/Fedora/openSUSE.
          # appimage -> a single self-contained file that runs without installing.
          - os: ubuntu-22.04
            label: Linux (deb + rpm + AppImage)
            bundles: deb,rpm,appimage
          # Windows: msi + nsis installers run on Windows 10 and 11.
          - os: windows-latest
            label: Windows (msi + nsis)
            bundles: msi,nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            file \
            libssl-dev \
            rpm

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target

      - name: Install JS dependencies
        run: npm ci

      # The licence public key has no compiled-in default: `src/license.rs` reads
      # it with `env!`, so a release build without it does not compile. Checking
      # here turns that into one readable line instead of a cargo error buried in
      # tauri-action's output, and stops a tag from half-publishing a release.
      #
      # It is a repository *variable*, not a secret: a public key is not
      # confidential, and masking it in the logs would only make a wrong-key
      # release harder to diagnose.
      - name: Require the licence signing public key
        shell: bash
        env:
          LICENSE_PUBKEY: ${{ vars.PAYMENT_SCHEDULE_LICENSE_PUBKEY }}
        run: |
          if [ -z "$LICENSE_PUBKEY" ]; then
            echo "::error::Repository variable PAYMENT_SCHEDULE_LICENSE_PUBKEY is not set."
            echo "Release builds must embed the production licence public key."
            echo "Set it under Settings -> Secrets and variables -> Actions -> Variables."
            echo "Generate one with the certificate-generation tool; see docs/license-format.md section 7."
            exit 1
          fi
          # Guard against shipping a build that trusts the published development
          # keypair, whose secret half is printed in docs/license-format.md.
          if [ "$LICENSE_PUBKEY" = "vA58s7GMDPCW-FnoVy7jDxJQWShUznnJM2aFPT5TVsc" ]; then
            echo "::error::PAYMENT_SCHEDULE_LICENSE_PUBKEY is the published DEVELOPMENT key."
            echo "Anyone who has read docs/license-format.md could mint licences this build accepts."
            echo "Generate a production keypair and set the variable to its public half."
            exit 1
          fi
          echo "Licence public key present (${#LICENSE_PUBKEY} chars)."

      # Builds the frontend (via beforeBuildCommand), then the native bundles, then
      # creates/updates the GitHub Release for this tag and uploads the installers to it.
      # Both matrix runners target the same tagName, so they attach to one shared Release.
      # --bundles overrides tauri.conf.json targets so each OS emits only its own installers.
      - name: Build & publish to GitHub Release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAYMENT_SCHEDULE_LICENSE_PUBKEY: ${{ vars.PAYMENT_SCHEDULE_LICENSE_PUBKEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "paymentSchedule ${{ github.ref_name }}"
          releaseBody: "Desktop installers for Linux (deb/rpm) and Windows (msi/nsis). See the assets below."
          # Published as a draft so you can review the assets and notes before it goes live.
          releaseDraft: true
          prerelease: false
          args: --bundles ${{ matrix.bundles }}
