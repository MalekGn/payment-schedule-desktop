name: CodeQL

# Static analysis of the JS/TS renderer code for security-relevant bugs (injection,
# unsafe DOM sinks, etc.). Results appear under the repo's Security -> Code scanning tab.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    # Mondays 07:00 UTC.
    - cron: "0 7 * * 1"

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-22.04
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Keep this at v4 or newer. v3.27.5 wrote literal `undefined` into the
      # `pr-diff-range` extension pack it generates on pull requests, which the
      # current CodeQL CLI rejects outright — only PR runs reach that code, so
      # push and schedule runs stayed green and hid it.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: ${{ matrix.language }}
          # security-and-quality adds maintainability queries on top of the default
          # security set — a good fit for a "clean and secure" baseline.
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          category: "/language:${{ matrix.language }}"
