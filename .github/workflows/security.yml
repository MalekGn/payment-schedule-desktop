name: Security audit

# Dependency-vulnerability and supply-chain scanning for both ecosystems:
#   - JS:   npm audit
#   - Rust: cargo audit (RustSec advisories) + cargo deny (advisories/licenses/bans/sources)
# Runs on every push/PR touching dependency manifests, and weekly so newly published
# advisories against already-pinned versions are still caught.
on:
  push:
    branches: [main, dev]
    paths:
      - "package.json"
      - "package-lock.json"
      - "src-tauri/Cargo.toml"
      - "src-tauri/Cargo.lock"
      - "src-tauri/deny.toml"
      - ".github/workflows/security.yml"
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - "src-tauri/Cargo.toml"
      - "src-tauri/Cargo.lock"
      - "src-tauri/deny.toml"
      - ".github/workflows/security.yml"
  schedule:
    # Mondays 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-audit:
    name: npm audit
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      # Fail only on high/critical so day-to-day moderate dev-tooling advisories
      # don't block merges; the weekly run still surfaces everything in the log.
      - name: npm audit (high & critical)
        run: npm audit --audit-level=high

  cargo-audit:
    name: cargo audit & cargo deny
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Install cargo-audit and cargo-deny (prebuilt)
        uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780 # v2.86.1
        with:
          tool: cargo-audit,cargo-deny

      # No-op when Cargo.lock is committed; generates one otherwise so the scans have
      # an exact dependency set to check.
      - name: Ensure Cargo.lock exists
        run: cargo generate-lockfile
        working-directory: src-tauri

      - name: cargo audit
        run: cargo audit
        working-directory: src-tauri

      - name: cargo deny
        run: cargo deny check
        working-directory: src-tauri
